name: Release (macOS & Linux Daemon)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*.*.*'
      - 'daemon-v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target (all, app, or daemon)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - app
          - daemon
      channel:
        description: 'Release channel (stable or beta)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      version:
        description: 'App version (X.Y.Z or X.Y.Z-beta.<build>; for beta use next upcoming X.Y.Z > latest stable; defaults to project.yml)'
        required: false
        default: ''
        type: string
      daemon_version:
        description: 'Daemon version (X.Y.Z or X.Y.Z-beta.<build>; for beta use next upcoming X.Y.Z > latest stable; defaults to package.json)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as a draft GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  meta:
    name: Resolve Metadata & Run Daemon Checks
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.meta.outputs.target }}
      channel: ${{ steps.meta.outputs.channel }}
      build: ${{ steps.meta.outputs.build }}
      built_at: ${{ steps.meta.outputs.built_at }}
      short_commit: ${{ steps.meta.outputs.short_commit }}
      app_version: ${{ steps.meta.outputs.app_version }}
      daemon_version: ${{ steps.meta.outputs.daemon_version }}
      daemon_channel: ${{ steps.meta.outputs.daemon_channel }}
      app_tag: ${{ steps.meta.outputs.app_tag }}
      daemon_tag: ${{ steps.meta.outputs.daemon_tag }}
      share_folder: ${{ steps.meta.outputs.share_folder }}
      wants_app: ${{ steps.meta.outputs.wants_app }}
      wants_daemon: ${{ steps.meta.outputs.wants_daemon }}
      delta_from: ${{ steps.meta.outputs.delta_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve release versions, channel & delta targets
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DAEMON_VERSION: ${{ inputs.daemon_version }}
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process';
            import { appendFileSync } from 'node:fs';
            import {
              checkReleaseVersionOrder,
              compareVersions,
              formatChannelVersion,
              generateBuildNumber,
              isBetaVersion,
              isReleaseVersion,
              readAppBaseVersion,
              readDaemonBaseVersion,
            } from './tools/sarto/build-version.mjs';

            const root = process.cwd();
            const eventName = process.env.EVENT_NAME;
            const refName = process.env.GITHUB_REF_NAME || '';

            let target = (process.env.INPUT_TARGET || 'all').trim();
            let channel = (process.env.INPUT_CHANNEL || 'stable').trim();
            let rawApp = (process.env.INPUT_VERSION || '').trim();
            let rawDaemon = (process.env.INPUT_DAEMON_VERSION || '').trim();

            if (eventName !== 'workflow_dispatch') {
              if (refName.startsWith('daemon-v')) {
                target = 'daemon';
                rawDaemon = refName.slice('daemon-v'.length);
                channel = isBetaVersion(rawDaemon) ? 'beta' : 'stable';
              } else if (refName.startsWith('app-v')) {
                target = 'app';
                rawApp = refName.slice('app-v'.length);
                channel = isBetaVersion(rawApp) ? 'beta' : 'stable';
              } else if (refName.startsWith('v')) {
                target = 'all';
                rawApp = refName.slice(1);
                channel = isBetaVersion(rawApp) ? 'beta' : 'stable';
                rawDaemon = rawApp;
              } else {
                throw new Error('Unsupported tag: ' + refName);
              }
            }

            // A beta tag names its build; the bundle's CFBundleVersion and the manifests carry it too.
            const build =
              /-beta\.(\d+)$/.exec(rawApp)?.[1] ||
              /-beta\.(\d+)$/.exec(rawDaemon)?.[1] ||
              generateBuildNumber();
            const builtAt = new Date().toISOString();
            const shortCommit = (process.env.GITHUB_SHA || '').slice(0, 7);
            const appVersion = formatChannelVersion(rawApp || readAppBaseVersion(root), channel, build);
            const daemonRaw =
              rawDaemon || (target === 'all' && channel === 'stable' && rawApp && !process.env.INPUT_DAEMON_VERSION ? rawApp : readDaemonBaseVersion(root));
            // As in release.mjs: an app-only release bundles the published daemon version as it is.
            const daemonChannel = target === 'app' && !isBetaVersion(daemonRaw) ? 'stable' : channel;
            const daemonVersion = formatChannelVersion(daemonRaw, daemonChannel, build);

            const wantsApp = target === 'all' || target === 'app';
            const wantsDaemon = target === 'all' || target === 'daemon';
            const ignoreTag = process.env.GITHUB_REF_TYPE === 'tag' ? refName : undefined;
            if (wantsApp) {
              const err = checkReleaseVersionOrder({
                kind: 'app',
                channel,
                version: appVersion,
                root,
                ignoreTag,
              });
              if (err) throw new Error(err);
            }
            if (wantsDaemon) {
              const err = checkReleaseVersionOrder({
                kind: 'daemon',
                channel,
                version: daemonVersion,
                root,
                ignoreTag,
              });
              if (err) throw new Error(err);
            }
            const shareFolder = wantsApp && wantsDaemon && channel === 'stable' && appVersion === daemonVersion;
            const appTag = shareFolder ? 'v' + appVersion : 'app-v' + appVersion;
            const daemonTag = shareFolder ? appTag : 'daemon-v' + daemonVersion;

            const allowedDelta = (v) =>
              channel === 'beta' ? isReleaseVersion(v) || isBetaVersion(v) : isReleaseVersion(v);
            const deltaFrom = wantsApp
              ? [...new Set(
                  execFileSync('git', ['tag', '-l', 'v*.*.*', 'app-v*.*.*'], { encoding: 'utf8' })
                    .split(/\r?\n/)
                    .map((t) => t.trim().replace(/^(?:app-)?v/, ''))
                    .filter((v) => allowedDelta(v) && compareVersions(v, appVersion) < 0),
                )]
                  .sort((a, b) => compareVersions(b, a))
                  .slice(0, 2)
                  .join(',')
              : '';

            const out = process.env.GITHUB_OUTPUT;
            const lines = [
              'target=' + target,
              'channel=' + channel,
              'build=' + build,
              'built_at=' + builtAt,
              'short_commit=' + shortCommit,
              'app_version=' + appVersion,
              'daemon_version=' + daemonVersion,
              'daemon_channel=' + daemonChannel,
              'app_tag=' + appTag,
              'daemon_tag=' + daemonTag,
              'share_folder=' + (shareFolder ? 'true' : 'false'),
              'wants_app=' + (wantsApp ? 'true' : 'false'),
              'wants_daemon=' + (wantsDaemon ? 'true' : 'false'),
              'delta_from=' + deltaFrom,
            ];
            appendFileSync(out, lines.join('\n') + '\n');
            console.log(lines.join(' '));
          "

      - name: Install dependencies & verify checks
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test

  build-mac:
    name: Build macOS (App & darwin-arm64 Daemon)
    needs: meta
    if: needs.meta.outputs.wants_app == 'true' || needs.meta.outputs.wants_daemon == 'true'
    runs-on: macos-15
    env:
      SARTO_SIGN_IDENTITY: ${{ secrets.SARTO_SIGN_IDENTITY }}
      SARTO_NOTARY_KEY_ID: ${{ secrets.SARTO_NOTARY_KEY_ID }}
      SARTO_NOTARY_ISSUER: ${{ secrets.SARTO_NOTARY_ISSUER }}
      SARTO_GIT_COMMIT: ${{ needs.meta.outputs.short_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Swift packages
        if: needs.meta.outputs.wants_app == 'true'
        run: |
          (cd apps/apple/Packages/SartoProtocol && swift test)
          (cd apps/apple/Packages/PrismDesign && swift test)
          (cd apps/apple/Packages/SartoUpdate && swift test)

      - name: Import Apple Developer ID signing certificate (if configured)
        if: needs.meta.outputs.wants_app == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ] || [ -z "${SARTO_SIGN_IDENTITY:-}" ]; then
            echo "No Developer ID signing certificate configured; skipping import."
            exit 0
          fi
          KEYCHAIN_PATH="${RUNNER_TEMP}/sarto-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Write App Store Connect notary key (if configured)
        if: needs.meta.outputs.wants_app == 'true'
        env:
          SARTO_NOTARY_KEY_BASE64: ${{ secrets.SARTO_NOTARY_KEY_BASE64 }}
        run: |
          if [ -z "${SARTO_NOTARY_KEY_BASE64:-}" ]; then
            echo "No notary key configured; skipping."
            exit 0
          fi
          NOTARY_KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "$SARTO_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "SARTO_NOTARY_KEY=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build macOS app & darwin-arm64 daemon
        run: |
          TARGET="${{ needs.meta.outputs.target }}"
          CHANNEL="${{ needs.meta.outputs.channel }}"
          BUILD="${{ needs.meta.outputs.build }}"
          BUILT_AT="${{ needs.meta.outputs.built_at }}"
          SHORT_COMMIT="${{ needs.meta.outputs.short_commit }}"
          APP_VERSION="${{ needs.meta.outputs.app_version }}"
          DAEMON_VERSION="${{ needs.meta.outputs.daemon_version }}"
          APP_TAG="${{ needs.meta.outputs.app_tag }}"
          DAEMON_TAG="${{ needs.meta.outputs.daemon_tag }}"
          DELTA_FROM="${{ needs.meta.outputs.delta_from }}"

          mkdir -p dist/out-mac-app dist/out-daemon-darwin-arm64

          if [ "$TARGET" = "daemon" ]; then
            node tools/sarto/build-daemon-package.mjs \
              --version "$DAEMON_VERSION" \
              --build "$BUILD" \
              --channel "$CHANNEL" \
              --commit "$SHORT_COMMIT" \
              --built-at "$BUILT_AT" \
              --out dist/out-daemon-darwin-arm64
            exit 0
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          BASE_VERSION="${APP_VERSION%%-*}"
          FOUND_NOTES=""
          for candidate in \
            "docs/release-notes/${APP_TAG}.md" \
            "docs/release-notes/v${APP_VERSION}.md" \
            "docs/release-notes/v${BASE_VERSION}.md"; do
            if [ -f "$candidate" ]; then
              FOUND_NOTES="$candidate"
              break
            fi
          done
          if [ -n "$FOUND_NOTES" ]; then
            cp "$FOUND_NOTES" "$NOTES_FILE"
            echo "Using release notes from $FOUND_NOTES"
          else
            cat > "$NOTES_FILE" <<EOF
          ## What changed

          - Sarto ${APP_VERSION} (${CHANNEL}, build ${BUILD}) built from commit ${GITHUB_SHA}.
          EOF
          fi

          ARGS=(
            --target "$TARGET"
            --channel "$CHANNEL"
            --app-version "$APP_VERSION"
            --daemon-version "$DAEMON_VERSION"
            --build "$BUILD"
            --built-at "$BUILT_AT"
            --notes "$NOTES_FILE"
            --out dist/release
            --skip-update-sign
          )
          if [ -n "$DELTA_FROM" ]; then
            ARGS+=(--delta-from "$DELTA_FROM")
          fi
          if [ -z "${SARTO_SIGN_IDENTITY:-}" ] || [ -z "${SARTO_NOTARY_KEY:-}" ]; then
            ARGS+=(--skip-notarize)
          fi
          if [ "${{ needs.meta.outputs.wants_daemon }}" = "true" ]; then
            # Keeps the darwin-arm64 archive and the .meta.json the publish job checks it against.
            ARGS+=(--daemon-package-dir dist/out-daemon-darwin-arm64)
          fi
          node tools/sarto/release.mjs "${ARGS[@]}"

          # Separate macOS app artifacts from the darwin-arm64 daemon archive so the publish job
          # assembles a unified multi-platform daemon manifest and checksums file cleanly.
          shopt -s nullglob
          for file in \
            "dist/release/${APP_TAG}"/Sarto-*.zip \
            "dist/release/${APP_TAG}"/Sarto-*.dmg \
            "dist/release/${APP_TAG}"/Sarto-*.delta \
            "dist/release/${APP_TAG}"/latest-mac.json \
            "dist/release/${APP_TAG}"/beta-mac.json; do
            if [ -f "$file" ]; then
              cp "$file" dist/out-mac-app/
            fi
          done
          cp "$NOTES_FILE" dist/out-mac-app/release-notes.md

      - name: Upload macOS app release artifacts
        if: needs.meta.outputs.wants_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-release
          path: dist/out-mac-app/
          if-no-files-found: error

      - name: Upload darwin-arm64 daemon artifact
        if: needs.meta.outputs.wants_daemon == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daemon-darwin-arm64
          path: |
            dist/out-daemon-darwin-arm64/sarto-daemon-darwin-arm64.tar.gz
            dist/out-daemon-darwin-arm64/sarto-daemon-darwin-arm64.meta.json
          if-no-files-found: error

      - name: Clean up ephemeral Apple credentials
        if: always() && needs.meta.outputs.wants_app == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/sarto-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/notary-key.p8"

  build-linux-daemon:
    name: Build Linux Daemon (${{ matrix.arch }})
    needs: meta
    if: needs.meta.outputs.wants_daemon == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies & compile node-pty against glibc 2.28
        run: pnpm install --frozen-lockfile

      - name: Build, verify ABI <= glibc 2.28 & smoke-test linux-${{ matrix.arch }} daemon
        run: |
          node tools/sarto/build-daemon-package.mjs \
            --version "${{ needs.meta.outputs.daemon_version }}" \
            --build "${{ needs.meta.outputs.build }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --commit "${{ needs.meta.outputs.short_commit }}" \
            --built-at "${{ needs.meta.outputs.built_at }}" \
            --max-glibc 2.28 \
            --out "dist/out-daemon-linux-${{ matrix.arch }}"

      - name: Upload linux-${{ matrix.arch }} daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-${{ matrix.arch }}
          path: |
            dist/out-daemon-linux-${{ matrix.arch }}/sarto-daemon-linux-${{ matrix.arch }}.tar.gz
            dist/out-daemon-linux-${{ matrix.arch }}/sarto-daemon-linux-${{ matrix.arch }}.meta.json
          if-no-files-found: error

  publish:
    name: Assemble, Sign, Attest & Publish Release
    needs: [meta, build-mac, build-linux-daemon]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped') &&
      (needs.build-linux-daemon.result == 'success' || needs.build-linux-daemon.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SARTO_UPDATE_SIGNING_KEY: ${{ secrets.SARTO_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release directories & sign manifests
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          BUILD="${{ needs.meta.outputs.build }}"
          BUILT_AT="${{ needs.meta.outputs.built_at }}"
          APP_TAG="${{ needs.meta.outputs.app_tag }}"
          DAEMON_TAG="${{ needs.meta.outputs.daemon_tag }}"
          DAEMON_VERSION="${{ needs.meta.outputs.daemon_version }}"
          WANTS_APP="${{ needs.meta.outputs.wants_app }}"
          WANTS_DAEMON="${{ needs.meta.outputs.wants_daemon }}"

          mkdir -p dist/release

          if [ "$WANTS_APP" = "true" ]; then
            OUT_APP="dist/release/${APP_TAG}"
            mkdir -p "$OUT_APP"
            shopt -s nullglob
            for file in artifacts/mac-app-release/*; do
              if [ "$(basename "$file")" = "release-notes.md" ]; then
                cp "$file" "${RUNNER_TEMP}/release-notes.md"
              else
                cp "$file" "$OUT_APP/"
              fi
            done
            if [ -n "${SARTO_UPDATE_SIGNING_KEY:-}" ]; then
              MAC_MANIFEST="latest-mac.json"
              if [ "$CHANNEL" = "beta" ]; then
                MAC_MANIFEST="beta-mac.json"
              fi
              node tools/sarto/signing.mjs "${OUT_APP}/${MAC_MANIFEST}"
            else
              # Never publish unsigned channel manifests without a .sig companion.
              rm -f "${OUT_APP}/latest-mac.json" "${OUT_APP}/beta-mac.json"
            fi
          fi

          if [ "$WANTS_DAEMON" = "true" ]; then
            OUT_DAEMON="dist/release/${DAEMON_TAG}"
            mkdir -p "$OUT_DAEMON"
            ASSEMBLE_ARGS=(
              --in artifacts/daemon-darwin-arm64
              --in artifacts/daemon-linux-x64
              --in artifacts/daemon-linux-arm64
              --out "$OUT_DAEMON"
              --version "$DAEMON_VERSION"
              --tag "$DAEMON_TAG"
              --channel "$CHANNEL"
              --build "$BUILD"
              --built-at "$BUILT_AT"
              --require-platforms darwin-arm64,linux-x64,linux-arm64
            )
            if [ -z "${SARTO_UPDATE_SIGNING_KEY:-}" ]; then
              ASSEMBLE_ARGS+=(--allow-unsigned)
            fi
            node tools/sarto/assemble-daemon-release.mjs "${ASSEMBLE_ARGS[@]}"
            if [ -z "${SARTO_UPDATE_SIGNING_KEY:-}" ]; then
              rm -f "${OUT_DAEMON}/latest-daemon.json" "${OUT_DAEMON}/beta-daemon.json"
            fi
          fi

          for dir in dist/release/*/; do
            (
              cd "$dir"
              shopt -s nullglob
              TARGETS=(Sarto-*.dmg Sarto-*.zip Sarto-*.delta sarto-daemon-*.tar.gz)
              if [ "${#TARGETS[@]}" -gt 0 ]; then
                sha256sum "${TARGETS[@]}" > SHA256SUMS.txt
              fi
            )
          done

      - name: Attest build provenance (SLSA)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*/Sarto-*
            dist/release/*/sarto-daemon-*.tar.gz
            dist/release/*/SHA256SUMS.txt

      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          BUILD="${{ needs.meta.outputs.build }}"

          DRAFT_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          PRE_FLAG=""
          if [ "$CHANNEL" = "beta" ]; then
            PRE_FLAG="--prerelease"
          fi

          for dir in dist/release/*/; do
            TAG="$(basename "$dir")"
            LATEST_FLAG=""
            if [ "$CHANNEL" != "beta" ] && [[ "$TAG" == daemon-v* ]]; then
              # Decoupled standalone daemon releases must not hijack GitHub's /releases/latest
              # pointer that desktop clients query for latest-mac.json.
              LATEST_FLAG="--latest=false"
            fi
            BODY_FILE="${RUNNER_TEMP}/gh-release-${TAG}.md"
            NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
            {
              echo "## Sarto ${TAG}"
              echo ""
              if [[ "$TAG" != daemon-v* ]] && [ -f "$NOTES_FILE" ]; then
                cat "$NOTES_FILE"
                echo ""
              fi
              echo "---"
              echo ""
              echo "Channel: \`${CHANNEL}\` · Build: \`${BUILD}\` · Commit: \`${GITHUB_SHA}\`"
              echo ""
              echo "Built directly in GitHub Actions with signed SLSA Build Provenance Attestations."
              echo ""
              echo '```sh'
              echo '# macOS'
              echo 'shasum -a 256 -c SHA256SUMS.txt --ignore-missing'
              echo '# Linux'
              echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
              echo '```'
            } > "$BODY_FILE"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$dir"* --clobber
            else
              gh release create "$TAG" "$dir"* \
                --target "$GITHUB_SHA" \
                --title "Sarto ${TAG}" \
                --notes-file "$BODY_FILE" \
                $DRAFT_FLAG $PRE_FLAG $LATEST_FLAG
            fi
          done
