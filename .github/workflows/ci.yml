name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:daemon

  macos:
    name: macOS (Swift packages & SartoMac)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test Swift packages
        run: |
          (cd apps/apple/Packages/SartoProtocol && swift test)
          (cd apps/apple/Packages/PrismDesign && swift test)
          (cd apps/apple/Packages/SartoUpdate && swift test)

      - name: Build SartoMac
        run: |
          xcodebuild \
            -project apps/apple/Sarto.xcodeproj \
            -scheme SartoMac \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
